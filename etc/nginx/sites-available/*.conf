# ===================================
# HTTP Block: Redirect to HTTPS + ACME
# ===================================
server {
    listen 80;
    server_name api.kubu-hai.com;

    # ACME challenge location for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===================================
# HTTPS Block: Production-ready
# ===================================
server {
    listen 443 ssl http2;
    server_name api.kubu-hai.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.kubu-hai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kubu-hai.com/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM";
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Proxy to FastAPI backend
    location / {
        proxy_pass http://app:8000;  # Docker service name or internal host
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Optional: serve ACME challenge over HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
